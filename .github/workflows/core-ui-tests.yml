name: Core and UI tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run Pure Core tests
        run: dotnet test tests/CS2AssetPerformanceAuditor.Tests/CS2AssetPerformanceAuditor.Tests.csproj --configuration Release

  ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: UI/package-lock.json
      - name: Install UI dependencies
        run: npm ci
      - name: Run UI tests
        run: npm test
      - name: Build UI
        run: npm run build
