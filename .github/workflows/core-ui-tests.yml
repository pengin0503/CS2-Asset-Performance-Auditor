name: Core and UI tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run Pure Core tests
        run: dotnet test tests/CS2AssetPerformanceAuditor.Tests/CS2AssetPerformanceAuditor.Tests.csproj --configuration Release
      # The adapter contract tests need the game's managed assemblies to run, which CI does not have.
      # Building them still catches compile breaks before they reach a machine with the game installed.
      - name: Build adapter contract tests
        run: dotnet build tests/CS2AssetPerformanceAuditor.AdapterTests/CS2AssetPerformanceAuditor.AdapterTests.csproj --configuration Release

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: UI/package-lock.json
      - name: Install UI dependencies
        run: npm ci
      - name: Run UI tests
        run: npm test
      - name: Build UI
        run: npm run build
